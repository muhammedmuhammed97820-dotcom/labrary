<main class="management" [class.dark]="theme.isDarkMode()" dir="rtl"><div class="shell"><header><div><span>ADMIN · AUTHORS</span><h1>إدارة <em>المؤلفين</em></h1><p>إضافة وتعديل صور وبيانات المؤلفين.</p></div><button (click)="new()">＋ مؤلف جديد</button></header><section class="layout"><div class="list"><h2>دليل المؤلفين <small>{{authors.length}}</small></h2><article *ngFor="let a of authors"><div class="avatar"><img *ngIf="a.image" [src]="url(a.image)"><span *ngIf="!a.image">{{a.name?.charAt(0)}}</span></div><div><strong>{{a.name}}</strong><small>{{a.booksCount||0}} كتاب · {{a.nationality||'غير محدد'}}</small></div><aside><button (click)="edit(a)">تعديل</button><button class="danger" (click)="remove(a)">حذف</button></aside></article></div><div class="form"><h2>{{editing?'تعديل المؤلف':'إضافة مؤلف'}}</h2><form #f="ngForm" (ngSubmit)="save()"><div class="photo"><div class="big"><img *ngIf="preview" [src]="preview"><span *ngIf="!preview">{{author.name?.charAt(0)||'م'}}</span></div><label>رفع صورة<input type="file" accept="image/*" (change)="pick($event)"></label></div><label>الاسم<input name="name" [(ngModel)]="author.name" required></label><label>السيرة<textarea name="bio" rows="4" [(ngModel)]="author.bio"></textarea></label><div class="two"><label>الميلاد<input type="date" name="birthDate" [(ngModel)]="author.birthDate"></label><label>الوفاة<input type="date" name="deathDate" [(ngModel)]="author.deathDate"></label></div><label>مكان الميلاد<input name="birthPlace" [(ngModel)]="author.birthPlace"></label><div class="two"><label>الجنسية<input name="nationality" [(ngModel)]="author.nationality"></label><label>المهنة<input name="occupation" [(ngModel)]="author.occupation"></label></div><label>الموقع الرسمي<input name="website" [(ngModel)]="author.website"></label><footer><button type="button" (click)="new()">إلغاء</button><button type="submit" [disabled]="f.invalid||saving">{{saving?'جارٍ الحفظ...':'حفظ المؤلف'}}</button></footer></form><p class="message">{{message||error}}</p></div></section></div></main>
