<section class="entity-page"><div class="entity-head"><div><span>إدارة المحتوى</span><h1>المؤلفون</h1><p>أنشئ ملفات المؤلفين، أضف سيرهم وصورهم وأدر بياناتهم.</p></div><button class="primary" (click)="newAuthor()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>مؤلف جديد</button></div><div class="entity-layout"><form class="editor glass" (ngSubmit)="save()"><div class="editor-title"><div><small>{{ editing ? 'تعديل المؤلف' : 'مؤلف جديد' }}</small><h2>{{ editing ? editing.name : 'إنشاء ملف مؤلف' }}</h2></div><button type="button" class="icon-btn" (click)="newAuthor()">×</button></div><label>الاسم *<input name="name" [(ngModel)]="author.name" placeholder="اسم المؤلف"></label><div class="two"><label>تاريخ الميلاد<input name="birthDate" type="date" [(ngModel)]="author.birthDate"></label><label>تاريخ الوفاة<input name="deathDate" type="date" [(ngModel)]="author.deathDate"></label></div><div class="two"><label>مكان الميلاد<input name="birthPlace" [(ngModel)]="author.birthPlace"></label><label>الجنسية<input name="nationality" [(ngModel)]="author.nationality"></label></div><div class="two"><label>المهنة<input name="occupation" [(ngModel)]="author.occupation"></label><label>الموقع الإلكتروني<input name="website" [(ngModel)]="author.website"></label></div><label>السيرة الذاتية<textarea name="bio" rows="6" [(ngModel)]="author.bio"></textarea></label><label class="avatar-upload"><input type="file" accept="image/*" (change)="pick($event)"><span *ngIf="!preview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M6 20a6 6 0 0 1 12 0"/></svg><strong>رفع صورة المؤلف</strong></span><img *ngIf="preview" [src]="preview" alt="صورة المؤلف"></label><div class="form-actions"><button type="button" class="ghost" (click)="newAuthor()">مسح</button><button class="primary" type="submit" [disabled]="saving">{{ saving ? 'جارٍ الحفظ...' : (editing ? 'حفظ التعديل' : 'إضافة المؤلف') }}</button></div></form><div class="list-area"><div *ngIf="loading" class="empty glass">جاري التحميل...</div><div *ngIf="!loading && !authors.length" class="empty glass">لا يوجد مؤلفون بعد.</div><div class="entity-grid"><article class="person-card glass" *ngFor="let a of authors"><div class="person-photo"><img *ngIf="a.image" [src]="url(a.image)" [alt]="a.name"><span *ngIf="!a.image"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></div><h3>{{ a.name }}</h3><p>{{ a.nationality || 'مؤلف' }}</p><div class="person-actions"><button (click)="edit(a)" class="edit">تعديل</button><button (click)="promptDelete(a)" class="delete">{{ deletingId === a._id ? 'تأكيد الحذف' : 'حذف' }}</button><button *ngIf="deletingId === a._id" (click)="cancelDelete()" class="cancel">إلغاء</button></div></article></div></div></div></section>
