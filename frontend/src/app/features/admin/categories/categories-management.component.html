<section class="category-page"><div class="category-head"><div><span>تنظيم المحتوى</span><h1>التصنيفات</h1><p>أنشئ التصنيفات ووصفها وحافظ على تنظيم الكتب.</p></div><button class="primary" (click)="newCategory()"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>تصنيف جديد</button></div><div class="category-layout"><form class="editor glass" (ngSubmit)="save()"><div class="editor-title"><div><small>{{ editing ? 'تعديل' : 'إنشاء' }}</small><h2>{{ editing ? editing.name : 'تصنيف جديد' }}</h2></div><button type="button" class="icon-btn" (click)="newCategory()">×</button></div><label>اسم التصنيف *<input name="name" [(ngModel)]="category.name" placeholder="مثال: التاريخ"></label><label>الوصف<textarea name="description" rows="6" [(ngModel)]="category.description" placeholder="وصف مختصر للتصنيف..."></textarea></label><div class="form-actions"><button type="button" class="ghost" (click)="newCategory()">مسح</button><button class="primary" type="submit" [disabled]="saving">{{ saving ? 'جارٍ الحفظ...' : (editing ? 'حفظ التعديل' : 'إضافة التصنيف') }}</button></div></form><div class="category-grid"><div *ngIf="loading" class="empty glass">جاري تحميل التصنيفات...</div><div *ngIf="!loading && !categories.length" class="empty glass">لا توجد تصنيفات بعد.</div><article class="category-card glass" *ngFor="let c of categories"><div class="cat-icon"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg></div><h3>{{ c.name }}</h3><p>{{ c.description || 'لا يوجد وصف لهذا التصنيف.' }}</p><div class="cat-actions"><button class="edit" (click)="edit(c)">تعديل</button><button class="delete" (click)="promptDelete(c)">{{ deletingId === c._id ? 'تأكيد الحذف' : 'حذف' }}</button><button *ngIf="deletingId === c._id" class="cancel" (click)="cancelDelete()">إلغاء</button></div></article></div></div></section>
