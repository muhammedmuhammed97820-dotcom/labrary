<section class="form-page"><div class="form-head"><div><a routerLink="/admin/books" class="back">← العودة للكتب</a><span>محتوى جديد</span><h1>إضافة كتاب جديد</h1><p>أدخل بيانات الكتاب وارفع ملف PDF والغلاف.</p></div></div><form class="form-layout" (ngSubmit)="submit()"><div class="form-main glass"><div class="form-section"><h2>بيانات الكتاب</h2><div class="fields"><label>عنوان الكتاب *<input name="title" [(ngModel)]="form.title" placeholder="مثال: مقدمة في الأدب العربي"></label><label>المؤلف *<input name="author" [(ngModel)]="form.author" placeholder="اسم المؤلف"></label><label>التصنيف *<input name="category" [(ngModel)]="form.category" placeholder="التصنيف"></label><label>سنة النشر<input name="publishedYear" type="number" [(ngModel)]="form.publishedYear" placeholder="2026"></label><label>التقييم<input name="rating" type="number" min="0" max="5" step="0.1" [(ngModel)]="form.rating"></label><label class="full">الوصف<textarea name="description" rows="6" [(ngModel)]="form.description" placeholder="نبذة مختصرة عن الكتاب..."></textarea></label></div></div><div class="upload-grid"><label class="upload-box"><input type="file" accept="application/pdf" (change)="onBookFile($event)"><span><svg viewBox="0 0 24 24"><path d="M14 2H6v20h12V6z"/><path d="M14 2v4h4M8 13h8M8 17h6"/></svg><strong>{{ bookFile?.name || 'رفع ملف PDF' }}</strong><small>اسحب الملف أو اضغط للاختيار</small></span></label><label class="upload-box"><input type="file" accept="image/*" (change)="onCover($event)"><span *ngIf="!coverPreviewUrl"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><strong>رفع غلاف الكتاب</strong><small>PNG أو JPG</small></span><img *ngIf="coverPreviewUrl" [src]="coverPreviewUrl" alt="معاينة الغلاف"></label></div><div class="form-actions"><a routerLink="/admin/books" class="ghost">إلغاء</a><button class="primary" type="submit" [disabled]="submitting"><span *ngIf="submitting">جارٍ الحفظ...</span><span *ngIf="!submitting">حفظ ونشر الكتاب</span></button></div></div><aside class="form-side glass"><div class="tip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 10v6M12 7h.01"/></svg><h3>ملاحظات مهمة</h3><p>تأكد من أن ملف الكتاب بصيغة PDF وأن الغلاف واضح ومناسب. الحقول التي تحمل علامة * مطلوبة.</p></div></aside></form></section>
