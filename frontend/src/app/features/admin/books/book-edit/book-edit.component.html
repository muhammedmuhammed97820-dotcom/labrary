<main class="page"><header><a routerLink="/admin">← إدارة الكتب</a><span>ADMIN · EDIT</span><h1>تعديل الكتاب</h1><p>حدّث بيانات الكتاب أو استبدل ملفه وغلافه.</p></header>@if(loading){<section class="state">جارِ تحميل بيانات الكتاب...</section>}@else{<form (ngSubmit)="save()"><div class="grid"><label>العنوان *<input [(ngModel)]="book.title" name="title" required></label><label>المؤلف *<input [ngModel]="typeof book.author==='string'?book.author:book.author.name" (ngModelChange)="book.author=$event" name="author" required></label><label>التصنيف *<input [ngModel]="typeof book.category==='string'?book.category:book.category.name" (ngModelChange)="book.category=$event" name="category" required></label><label>سنة النشر<input type="number" [(ngModel)]="book.publishedYear" name="year"></label><label>التقييم<input type="number" min="0" max="5" step="0.1" [(ngModel)]="book.rating" name="rating"></label><label class="check"><input type="checkbox" [(ngModel)]="book.isAvailable" name="available"> الكتاب متاح</label></div><label>الوصف<textarea [(ngModel)]="book.description" name="description" rows="7"></textarea></label><div class="files"><label>استبدال ملف PDF<input type="file" accept="application/pdf" (change)="onFile($event,'pdf')"><small>{{pdf?.name || 'اتركه فارغًا للإبقاء على الملف الحالي'}}</small></label><label>استبدال الغلاف<input type="file" accept="image/*" (change)="onFile($event,'cover')"><small>{{cover?.name || 'اتركه فارغًا للإبقاء على الغلاف الحالي'}}</small></label></div>@if(error){<div class="error">{{error}}</div>}<footer><a routerLink="/admin">إلغاء</a><button [disabled]="saving">{{saving?'جارِ الحفظ...':'حفظ التعديلات'}}</button></footer></form>}</main>
