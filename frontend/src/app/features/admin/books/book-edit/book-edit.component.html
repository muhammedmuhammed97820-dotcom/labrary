<section class="form-page"><div class="form-head"><div><a routerLink="/admin/books" class="back">← العودة للكتب</a><span>تعديل المحتوى</span><h1>تعديل الكتاب</h1><p>حدّث بيانات الكتاب أو استبدل ملفه وغلافه.</p></div></div><div *ngIf="loading" class="loading glass">جاري تحميل بيانات الكتاب...</div><form *ngIf="!loading" class="form-layout" (ngSubmit)="save()"><div class="form-main glass"><div class="fields"><label>عنوان الكتاب *<input name="title" [(ngModel)]="book.title"></label><label>المؤلف *<input name="author" [(ngModel)]="authorName"></label><label>التصنيف *<input name="category" [(ngModel)]="categoryName"></label><label>سنة النشر<input name="publishedYear" type="number" [(ngModel)]="book.publishedYear"></label><label>التقييم<input name="rating" type="number" min="0" max="5" step="0.1" [(ngModel)]="book.rating"></label><label class="switch"><input name="available" type="checkbox" [(ngModel)]="book.isAvailable"><span></span> الكتاب متاح للقراءة والتحميل</label><label class="full">الوصف<textarea name="description" rows="7" [(ngModel)]="book.description"></textarea></label></div><div class="upload-grid"><label class="upload-box"><input type="file" accept="application/pdf" (change)="onFile($event,'pdf')"><svg viewBox="0 0 24 24"><path d="M14 2H6v20h12V6z"/><path d="M14 2v4h4M8 13h8M8 17h6"/></svg><strong>{{ pdf?.name || 'استبدال ملف PDF' }}</strong><small>اتركه فارغاً للإبقاء على الملف الحالي</small></label><label class="upload-box"><input type="file" accept="image/*" (change)="onFile($event,'cover')"><img *ngIf="coverPreviewUrl" [src]="coverPreviewUrl" alt="معاينة الغلاف"><div *ngIf="!coverPreviewUrl" class="current"><strong>استبدال الغلاف</strong><small>اختر صورة جديدة عند الحاجة</small></div></label></div><div class="form-actions"><a routerLink="/admin/books" class="ghost">إلغاء</a><button class="primary" type="submit" [disabled]="saving">{{ saving ? 'جارٍ الحفظ...' : 'حفظ التعديلات' }}</button></div></div><aside class="form-side glass"><h3>حالة الكتاب</h3><p>يمكنك إيقاف إتاحة الكتاب مؤقتاً دون حذفه.</p><div class="side-line"><span>المعرّف</span><strong>{{ id }}</strong></div></aside></form></section>
