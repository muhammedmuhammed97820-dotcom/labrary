<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm" dir="rtl">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" routerLink="/" (click)="closeMenu()">
      <span class="badge bg-warning text-dark rounded-circle p-2">م</span>
      <span><strong class="d-block">مَكتبة</strong><small class="d-block text-secondary" style="font-size:.65rem">DIGITAL LIBRARY</small></span>
    </a>
    <button class="navbar-toggler" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="mainNavbar" aria-label="القائمة">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="menuOpen" id="mainNavbar">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 text-center">
        <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/books" routerLinkActive="active" (click)="closeMenu()">المكتبة</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/books" fragment="categories" (click)="closeMenu()">التصنيفات</a></li>
        @if (isLoggedIn) { <li class="nav-item"><a class="nav-link" routerLink="/favorites" routerLinkActive="active" (click)="closeMenu()">المفضلة</a></li> }
        @if (isAdmin) { <li class="nav-item"><a class="nav-link" routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">الإدارة</a></li> }
      </ul>
      <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-2">
        <a class="btn btn-outline-light btn-sm" routerLink="/books" (click)="closeMenu()">بحث</a>
        @if (isLoggedIn) {
          <a class="btn btn-outline-warning btn-sm d-flex align-items-center justify-content-center gap-2" routerLink="/profile" (click)="closeMenu()">
            @if (avatar) { <img [src]="avatar" [alt]="userName" class="rounded-circle object-fit-cover" width="28" height="28"> }
            @else { <span class="badge bg-warning text-dark rounded-circle">{{ userInitial }}</span> }
            <span>{{ userName }}</span>
          </a>
          <button class="btn btn-outline-danger btn-sm" type="button" (click)="logout()">خروج</button>
        } @else {
          <a class="btn btn-outline-light btn-sm" routerLink="/login" (click)="closeMenu()">دخول</a>
          <a class="btn btn-warning btn-sm fw-bold" routerLink="/register" (click)="closeMenu()">ابدأ الآن</a>
        }
      </div>
    </div>
  </div>
</nav>
