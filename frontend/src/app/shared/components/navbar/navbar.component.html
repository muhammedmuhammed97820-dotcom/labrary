<nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top" dir="rtl">
  <div class="container-fluid px-3 px-lg-5">
    <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/" (click)="closeMenu()">
      <span class="badge bg-warning text-dark rounded-circle p-2">م</span>
      <span><strong>مَكتبة</strong><small class="d-block text-secondary">DIGITAL LIBRARY</small></span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="القائمة">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-2">
        <li class="nav-item"><a class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/books" routerLinkActive="active" (click)="closeMenu()">المكتبة</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/books" fragment="categories" (click)="closeMenu()">التصنيفات</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/books" (click)="closeMenu()">استكشف</a></li>
        @if (isLoggedIn) { <li class="nav-item"><a class="nav-link" routerLink="/favorites" routerLinkActive="active" (click)="closeMenu()">المفضلة</a></li> }
        @if (isAdmin) { <li class="nav-item"><a class="nav-link" routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">الإدارة</a></li> }
      </ul>

      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-outline-light btn-sm" routerLink="/books">بحث</a>
        @if (isLoggedIn) {
          <a class="btn btn-outline-warning btn-sm d-flex align-items-center gap-2" routerLink="/profile">
            @if (avatar) { <img [src]="avatar" [alt]="userName" width="28" height="28" class="rounded-circle"> }
            @else { <span class="badge bg-warning text-dark rounded-circle">{{ userInitial }}</span> }
            <span>{{ userName }}</span>
          </a>
          <button class="btn btn-outline-danger btn-sm" type="button" (click)="logout()">خروج</button>
        } @else {
          <a class="btn btn-outline-light btn-sm" routerLink="/login">دخول</a>
          <a class="btn btn-warning btn-sm" routerLink="/register">ابدأ الآن</a>

      </div>
    </div>
