<header class="nav glass" [class.menu-open]="menuOpen">
  <div class="nav-main">
    <a routerLink="/" class="brand" aria-label="المكتبة الإلكترونية" (click)="closeMenu()">
      <span class="brand-mark">
        <span class="brand-spark"></span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v15H6.5A2.5 2.5 0 0 0 4 20.5zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v15h4.5a2.5 2.5 0 0 1 2.5 2.5z"/><path d="M11 5h2M11 8h2M11 11h2"/></svg>
      </span>
      <span class="brand-copy"><b>المكتبة</b><small>الإلكترونية</small></span>
    </a>

    <nav class="main-nav" aria-label="التنقل الرئيسي">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span>
      </a>
      <a routerLink="/books" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H7a2 2 0 0 1-2-2z"/><path d="M7 4v16M10 8h6M10 11h6M10 14h4"/></svg><span>الكتب</span>
      </a>
      <a routerLink="/categories" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h5v8H4zM13 3h5a2 2 0 0 1 2 2v6h-7zM4 13h7v8H6a2 2 0 0 1-2-2zM13 13h7v6a2 2 0 0 1-2 2h-5z"/></svg><span>التصنيفات</span>
      </a>
      <a routerLink="/authors" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 4.5a3 3 0 0 1 0 5.8M17 14.5a5 5 0 0 1 3.5 5"/></svg><span>المؤلفون</span>
      </a>
      <a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.2 8.3-8 10-4.8-1.7-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></svg><span>الإدارة</span>
      </a>
    </nav>

    <div class="actions">
      <button class="icon-btn" type="button" (click)="onThemeToggle()" aria-label="تبديل الوضع الليلي">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3z"/></svg>
      </button>
      <button class="icon-btn customize-btn" type="button" (click)="onCustomize()" aria-label="تخصيص المظهر">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>
      </button>
      <a routerLink="/auth" class="login" (click)="closeMenu()"><span>تسجيل الدخول</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 7l5 5-5 5"/></svg></a>
      <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="mobile-navigation" aria-label="فتح قائمة التنقل">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-panel" id="mobile-navigation" [class.open]="menuOpen">
    <nav aria-label="التنقل على الهاتف">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>الرئيسية</span></a>
      <a routerLink="/books" routerLinkActive="active" (click)="closeMenu()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H7a2 2 0 0 1-2-2z"/><path d="M7 4v16M10 8h6M10 11h6M10 14h4"/></svg><span>الكتب</span></a>
      <a routerLink="/categories" routerLinkActive="active" (click)="closeMenu()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h5v8H4zM13 3h5a2 2 0 0 1 2 2v6h-7zM4 13h7v8H6a2 2 0 0 1-2-2zM13 13h7v6a2 2 0 0 1-2 2h-5z"/></svg><span>التصنيفات</span></a>
      <a routerLink="/authors" routerLinkActive="active" (click)="closeMenu()"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0M16 4.5a3 3 0 0 1 0 5.8M17 14.5a5 5 0 0 1 3.5 5"/></svg><span>المؤلفون</span></a>
      <a routerLink="/admin" routerLinkActive="active" (click)="closeMenu()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.2 8.3-8 10-4.8-1.7-8-5-8-10V6z"/><path d="m9 12 2 2 4-4"/></svg><span>الإدارة</span></a>
    </nav>
    <div class="mobile-actions">
      <button type="button" (click)="onThemeToggle()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.3A8.5 8.5 0 0 1 8.7 4a8.5 8.5 0 1 0 11.3 11.3z"/></svg>الوضع الليلي</button>
      <button type="button" (click)="onCustomize()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/></svg>تخصيص المظهر</button>
    </div>
  </div>
</header>
